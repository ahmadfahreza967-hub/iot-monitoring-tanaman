<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - IoT Monitoring Tanaman</title>
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-wrapper">
        
        <!-- Sisi Kiri: Banner & Ilustrasi -->
        <div class="left-banner">
            <div class="brand">
                <div class="brand-logo">
                    <img src="Logo_utama.png" alt="Logo Tanaman">
                </div>
                <div class="brand-text">
                    <h2>IoT Monitoring <span class="green-text">Tanaman</span>
                        <svg class="leaf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 7 0 6-4.5 11-10 11Z"/>
                            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                        </svg>
                    </h2>
                </div>
            </div>

            <div class="banner-content">
                <h1>Pulihkan Akses <br><span class="green-text">Akun Anda</span></h1>
                <p>Kami akan membantu Anda mengatur ulang kata sandi agar dapat kembali mengakses sistem monitoring.</p>
            </div>

            <div class="illustration-area">
                <img src="Logo_bawah.png" alt="Ilustrasi Monitoring Tanaman" class="banner-img">
            </div>
        </div>

        <!-- Sisi Kanan: Form Lupa Password -->
        <div class="right-form">
            <div class="form-container">
                <div class="form-header">
                    <h2>Lupa Password? 
                        <svg class="leaf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 7 0 6-4.5 11-10 11Z"/>
                            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                        </svg>
                    </h2>
                    <p>Masukkan email Anda untuk menerima instruksi reset password</p>
                </div>

                <form action="index.html" method="GET" class="login-form">
                    <div class="input-group">
                        <label for="email">Email Terdaftar</label>
                        <div class="input-field">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="20" height="16" x="2" y="4" rx="2"/>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                            </svg>
                            <input type="email" id="email" placeholder="Masukkan email Anda" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Kirim Instruksi Reset</button>
                </form>

                <p class="register-text">Kembali ke halaman <a href="index.html">Masuk</a></p>
            </div>
        </div>

    </div>

</body>
</html>
