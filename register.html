<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - IoT Monitoring Tanaman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-wrapper">
        <!-- Sisi Kiri: Banner & Ilustrasi -->
        <div class="left-banner">
            <div class="brand">
                <div class="brand-logo">
                    <img src="Logo_utama.png" alt="Logo Tanaman">
                </div>
                <div class="brand-text">
                    <h2>IoT Monitoring <span class="green-text">Tanaman</span>
                        <svg class="leaf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 7 0 6-4.5 11-10 11Z"/>
                            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                        </svg>
                    </h2>
                </div>
            </div>

            <div class="banner-content">
                <h1>Mulai Pantau Tanaman <br><span class="green-text">secara Otomatis</span></h1>
                <p>Buat akun sekarang untuk menghubungkan perangkat IoT dan memantau kondisi tanamanmu dari mana saja.</p>
            </div>

            <div class="illustration-area">
                <img src="Logo_bawah.png" alt="Ilustrasi Monitoring Tanaman" class="banner-img">
            </div>
        </div>

        <!-- Sisi Kanan: Form Register -->
        <div class="right-form">
            <div class="form-container">
                <div class="form-header">
                    <h2>Buat Akun Baru 
                        <svg class="leaf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 7 0 6-4.5 11-10 11Z"/>
                            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                        </svg>
                    </h2>
                    <p>Lengkapi data di bawah untuk membuat akun baru</p>
                </div>

                <form action="login.html" method="POST" class="register-form">
                    <div class="input-group">
                        <label for="fullname">Nama Lengkap</label>
                        <div class="input-field">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input type="text" id="fullname" placeholder="Masukkan nama lengkap Anda" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <div class="input-field">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="20" height="16" x="2" y="4" rx="2"/>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                            </svg>
                            <input type="email" id="email" placeholder="Masukkan email Anda" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-field">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="password" placeholder="Buat password baru" required>
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Daftar Sekarang</button>
                </form>

                <p class="register-text">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
            </div>
        </div>
    </div>

    <script>
        // Toggle Show/Hide Password
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.querySelector('.eye-icon');
        if (eyeIcon && passwordInput) {
            eyeIcon.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                eyeIcon.style.color = isPassword ? '#22c55e' : '#94a3b8';
            });
        }
    </script>
</body>
</html>
